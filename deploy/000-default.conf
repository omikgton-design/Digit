<VirtualHost *:80>
    ServerName 129.121.85.178
    ServerAdmin webmaster@localhost

    DocumentRoot /home/digit/frontend/dist
    DirectoryIndex index.html

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8005/api/
    ProxyPassReverse /api/ http://127.0.0.1:8005/api/
    ProxyPass /admin/ http://127.0.0.1:8005/admin/
    ProxyPassReverse /admin/ http://127.0.0.1:8005/admin/
    ProxyPass /management/ http://127.0.0.1:8005/management/
    ProxyPassReverse /management/ http://127.0.0.1:8005/management/

    Alias /media/ /home/digit/backend/media/
    Alias /static/ /home/digit/backend/staticfiles/

    <Directory /home/digit/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    <Directory /home/digit/backend/media>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /home/digit/backend/staticfiles>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/digit-ip-error.log
    CustomLog ${APACHE_LOG_DIR}/digit-ip-access.log combined
</VirtualHost>
